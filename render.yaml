databases:
  - name: ship-postgres
    plan: basic-1gb
    databaseName: ship
    user: ship

services:
  - type: web
    name: ship-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: render
      - key: SKIP_SSM_SECRETS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ship-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CDN_DOMAIN
        sync: false
      - key: FLEETGRAPH_PROACTIVE_ENABLED
        value: "1"
      - key: FLEETGRAPH_POLL_INTERVAL_MS
        value: "180000"
      - key: FLEETGRAPH_TRACE_BASE_PATH
        value: /fleetgraph/traces
      - key: FLEETGRAPH_SYNTHESIS_ENABLED
        value: "1"

  - type: web
    name: ship-web
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile.web.prod
    plan: starter
    autoDeploy: true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: ship-api
          property: host
      - key: API_SCHEME
        value: http
      - key: API_PORT
        value: "10000"
      - key: API_HEALTH_FALLBACK
        value: "0"
      - key: API_STARTUP_CHECK_MODE
        value: warn
      - key: API_STARTUP_CHECK_PATH
        value: /health
      - key: API_STARTUP_CHECK_RETRIES
        value: "3"
      - key: API_STARTUP_CHECK_TIMEOUT_SECONDS
        value: "2"

  - type: web
    name: ship-docs
    runtime: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: ./docs
    autoDeploy: true
