name: MVP Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  mvp-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@localhost:5432/ship_dev
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @ship/api db:migrate

      - name: Build shared
        run: pnpm build:shared

      - name: Generate public OpenAPI
        run: pnpm --filter @ship/api openapi:generate:public

      - name: API unit tests
        run: pnpm --filter @ship/api test

      - name: SDK type-check
        run: pnpm --filter @ship/sdk type-check

      - name: E2E OAuth PKCE gate
        run: pnpm test:e2e --grep "OAuth Authorization Code + PKCE"

      - name: Perf regression check (+10%)
        run: node scripts/mvp/perf-regression-check.mjs
