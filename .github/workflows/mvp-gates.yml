name: MVP Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  mvp-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@localhost:5432/ship_dev
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @ship/api db:migrate

      - name: Build shared
        run: pnpm build:shared

      - name: Generate public OpenAPI
        run: pnpm --filter @ship/api openapi:generate:public

      - name: API unit tests (exclude platform; see platform-gates)
        run: pnpm --filter @ship/api exec vitest run --exclude 'src/platform/**'

      - name: SDK type-check
        run: pnpm --filter @ship/sdk type-check

      - name: Build SDK
        run: pnpm --filter @ship/sdk build

      - name: Build API for E2E
        run: pnpm build:api

      - name: Build web for E2E
        run: pnpm build:web
        env:
          VITE_APP_ENV: test_e2e

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright operating system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: E2E OAuth PKCE gate
        run: pnpm test:e2e --grep "OAuth Authorization Code + PKCE"

      - name: Perf regression check (+10%)
        run: node scripts/mvp/perf-regression-check.mjs
