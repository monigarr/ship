name: aws-deploy-guard

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - gfa2_wk4_phase2

permissions:
  contents: read

jobs:
  aws-deploy-guard:
    name: aws-deploy-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run AWS deployment guard
        run: node scripts/ci/check-aws-deploy-guard.mjs
