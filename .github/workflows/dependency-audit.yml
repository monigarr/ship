name: dependency-audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - gfa2_wk4_phase2

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on high/critical production advisories
        run: node scripts/ci/check-prod-audit.mjs
