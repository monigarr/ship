name: attestation-check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - gfa2_wk4_phase2

permissions:
  contents: read

jobs:
  validate-attestation:
    name: validate-attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Validate ATTESTATION.md freshness and fields
        run: node scripts/ci/validate-attestation.mjs
